<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f6"><title>spam-extra / pages</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f6;color:#222927;font:350 15px/1.6 system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 12%,rgba(222,237,225,.72),transparent 48%),radial-gradient(ellipse at 88% 24%,rgba(232,241,227,.66),transparent 48%),linear-gradient(135deg,#fafaf6 0%,#f6f9f4 52%,#f9faf6 100%);background-size:140% 140%,140% 140%,140% 140%;background-position:0% 0%,100% 0%,0% 50%;z-index:-1;animation:appear 1.3s ease both,gradient-drift 30s ease-in-out 1.3s infinite alternate}a{color:inherit;text-decoration:none}a:focus-visible,input:focus-visible{outline:2px solid #52665e;outline-offset:4px}header,main,footer{width:min(760px,calc(100% - 48px));margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center;padding:35px 0;font-size:13px}header a{color:#535d58}.brand{font-weight:300;letter-spacing:-.3px}main{flex:1;padding:clamp(45px,10vh,110px) 0 60px;animation:enter .75s ease both}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:lowercase;color:#69756e;display:flex;align-items:center;gap:10px}.dot{width:7px;height:7px;background:#739a85;border-radius:50%;box-shadow:0 0 15px #739a8588}h1{font-size:clamp(48px,9vw,86px);line-height:1.05;letter-spacing:-.055em;margin:18px 0 10px;font-weight:300}p{color:#64716a;margin:0 0 38px;font-size:16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:0 0 12px;color:#64716a;font-size:12px}.toolbar input{background:#ffffffaa;color:#26312b;border:1px solid #dce2dd;border-radius:8px;padding:9px 12px;width:165px;font:inherit}.toolbar input::placeholder{color:#78837c}.links{display:grid;gap:10px}.item{display:flex;align-items:center;gap:16px;padding:19px 20px;border:1px solid #dce2dd;background:#ffffffb8;backdrop-filter:blur(18px);box-shadow:0 3px 16px #24372a06;border-radius:13px;transition:transform .22s,background .22s,border-color .22s;animation:enter .5s both;animation-delay:calc(var(--i)*65ms)}.item:hover{transform:translateY(-3px);background:#ffffff;border-color:#aebeb3}.symbol{width:42px;height:42px;display:grid;place-items:center;border:1px solid #dce2dd;background:#f4f6f3;border-radius:10px;color:#66786c;font-size:19px}.details{flex:1;min-width:0}.name{font-weight:400;font-size:16px;letter-spacing:-.02em}.desc{color:#69756e;font-size:12px;overflow-wrap:anywhere}.arrow{font-size:20px;color:#69756e;transition:transform .2s}.item:hover .arrow{transform:translate(2px,-2px)}footer{border-top:1px solid #dce2dd;padding:20px 0 28px;display:flex;justify-content:space-between;gap:12px;color:#748078;font-size:11px}footer a:hover,header a:hover{text-decoration:underline}@keyframes appear{from{opacity:0}to{opacity:1}}@keyframes gradient-drift{from{background-position:0% 0%,100% 0%,0% 50%}to{background-position:100% 100%,0% 100%,100% 50%}}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}@media(max-width:480px){header,main,footer{width:calc(100% - 32px)}footer{flex-wrap:wrap}.item{padding:15px}.toolbar input{width:130px}}
</style></head><body><header><a class="brand" href="https://github.com/spam-extra">spam-extra<span style="color:#89968e"> /</span></a><a href="https://github.com/spam-extra" target="_blank" rel="noopener">github &nearr;</a></header><main><div class="eyebrow"><span class="dot"></span> personal directory</div><h1>my pages.</h1><p>everything i've built, all in one place. everything here is subject to change.</p><div class="toolbar"><span id="count" aria-live="polite">02 / projects</span><input id="search" type="search" placeholder="find a page..." aria-label="find a page"></div><div class="links" id="links"></div><noscript><p><a href="https://spam-extra.github.io/christmas_carol/">christmas carrol</a> &middot; <a href="https://spam-extra.github.io/2/">games</a></p></noscript></main><footer><span>spam-extra &copy; <span id="year">2026</span></span><span>kei</span></footer><script>
const owner='spam-extra', root='https://spam-extra.github.io/';
const fallback=[{name:'christmas_carol',description:'word bank',has_pages:true},{name:'2',description:'open games',has_pages:true}];
let pages=fallback;const list=document.querySelector('#links'),search=document.querySelector('#search');const title=n=>({'christmas_carol':'christmas carrol','2':'games'}[n]||n.replace(/[-_]+/g,' ').toLowerCase());
function render(){const q=search.value.toLowerCase().trim();const matches=pages.filter(r=>(title(r.name)+' '+(r.description||'')).toLowerCase().includes(q));list.replaceChildren();document.querySelector('#count').textContent=String(matches.length).padStart(2,'0')+' / projects';matches.forEach((r,i)=>{const a=document.createElement('a');a.className='item';a.style.setProperty('--i',i);a.href=root+encodeURIComponent(r.name)+'/';a.target='_blank';a.rel='noopener';const icon=document.createElement('span');icon.className='symbol';icon.setAttribute('aria-hidden','true');icon.textContent='⌘';const details=document.createElement('div');details.className='details';const n=document.createElement('div');n.className='name';n.textContent=title(r.name);const d=document.createElement('div');d.className='desc';d.textContent=(r.description||'open project').toLowerCase();details.append(n,d);const arrow=document.createElement('span');arrow.className='arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='↗';a.append(icon,details,arrow);list.append(a)});if(!matches.length){const empty=document.createElement('p');empty.textContent='no matching pages.';list.append(empty)}}
search.addEventListener('input',render);document.querySelector('#year').textContent=new Date().getFullYear();render();
</script></body></html>
